<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回答一覧（管理者用）｜宮工房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  :root{
    --ink:#141414; --bg:#f2f2f3; --paper:#ffffff; --field:#f5f5f5;
    --line:rgba(20,20,20,.14); --line2:rgba(20,20,20,.24);
    --muted:#6b6b6b; --faint:#c2c2c2; --radius:10px; --danger:#b3382c;
    --head:"Barlow Condensed","Noto Sans JP",sans-serif;
    --body:"Barlow","Noto Sans JP",system-ui,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
  input,textarea,button{font:inherit;color:inherit}
  h1,h2,h3{font-family:var(--head);font-weight:700;margin:0}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .wrap{max-width:1200px;margin:0 auto;padding:36px 24px 60px}
  .top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;
       border-bottom:1px solid var(--ink);padding-bottom:18px;margin-bottom:28px}
  .kicker{font-family:var(--head);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
  .top h1{font-size:32px;margin-top:6px}
  .btn{border:1px solid var(--line2);background:transparent;color:var(--ink);padding:10px 18px;
       font-family:var(--head);font-size:13.5px;letter-spacing:.03em;cursor:pointer;border-radius:var(--radius)}
  .btn:hover{border-color:var(--ink)}
  .btn-solid{background:var(--ink);border-color:var(--ink);color:#fafafa}
  .btn-solid:hover{background:#3a3a3a;border-color:#3a3a3a}

  /* gate */
  .gate{max-width:420px;margin:14vh auto;padding:32px;border:1px solid var(--ink);background:var(--paper);border-radius:var(--radius)}
  .gate p{font-size:13px;color:var(--muted);margin:0 0 18px}
  .gate input{width:100%;border:1px solid transparent;background:var(--field);padding:12px 14px;
              font-size:16px;margin-bottom:14px;border-radius:var(--radius)}
  .gate input:hover{border-color:var(--line2)}
  .gate .err{color:var(--danger);font-size:13px;min-height:18px;margin-bottom:10px}

  /* filters */
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
  .filters input{border:1px solid transparent;background:var(--field);padding:10px 14px;font-size:14px;
                  min-width:220px;border-radius:var(--radius)}
  .filters input:hover{border-color:var(--line2)}

  /* table */
  .tablewrap{border:1px solid var(--ink);background:var(--paper);overflow:auto;border-radius:var(--radius)}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:760px}
  th{text-align:left;font-family:var(--head);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
     color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--ink);background:var(--field);
     position:sticky;top:0}
  td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:top}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--field)}
  .empty{padding:48px;text-align:center;color:var(--muted);font-size:14px}

  /* detail panel */
  .backdrop{position:fixed;inset:0;background:rgba(20,20,20,.45);display:none;align-items:flex-start;
            justify-content:center;padding:40px 16px;overflow:auto;z-index:30}
  .backdrop.open{display:flex}
  .panel{width:min(760px,100%);background:var(--paper);border:1px solid var(--ink);border-radius:var(--radius);overflow:hidden}
  .panel .head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
               padding:24px 28px;border-bottom:1px solid var(--line)}
  .panel .head h2{font-size:23px}
  .panel .body{padding:24px 28px}
  .panel .summary{white-space:pre-wrap;font-family:ui-monospace,"SFMono-Regular",Menlo,"Noto Sans JP",monospace;
                  font-size:13px;line-height:1.9;background:var(--field);color:var(--ink);padding:20px;
                  border:1px solid var(--line);border-radius:var(--radius)}
  .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px 18px;margin-bottom:20px;font-size:13.5px}
  .meta div span{display:block;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
  .note{font-size:12.5px;color:var(--muted);margin-top:16px;line-height:1.7}
  .status{font-size:13px;color:var(--muted);margin:16px 0}

  @media (max-width:720px){ .wrap{padding:24px 16px 48px} }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="kicker">Miyakobo Admin</div>
  <h1 style="font-size:22px;margin-top:8px 0 14px">管理者パスワード</h1>
  <p>回答一覧は、社内の管理者のみが閲覧できます。</p>
  <input id="passInput" type="password" placeholder="パスワード" autocomplete="off">
  <div class="err" id="gateErr"></div>
  <button class="btn btn-solid" id="gateBtn" type="button" style="width:100%;padding:13px">開く</button>
</div>

<div class="wrap" id="main" hidden>
  <div class="top">
    <div>
      <div class="kicker">Miyakobo</div>
      <h1>ヒアリング回答一覧</h1>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn" id="reloadBtn" type="button">再読み込み</button>
      <button class="btn" id="logoutBtn" type="button">ログアウト</button>
    </div>
  </div>

  <div class="filters">
    <input id="searchInput" type="text" placeholder="会社名・お名前・担当者で検索">
  </div>

  <div class="status" id="listStatus"></div>

  <div class="tablewrap">
    <table>
      <thead><tr>
        <th>会社名（案件）</th><th>受信日時</th><th>対応状況</th><th>社内担当者</th><th>ひとことまとめ</th><th>入力者</th><th>ご担当者</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="emptyMsg" hidden>まだ回答がありません。</div>
  </div>
</div>

<div class="backdrop" id="detailBackdrop">
  <div class="panel" id="panel">
    <div class="head">
      <div>
        <div class="kicker" id="detailKicker"></div>
        <h2 id="detailTitle"></h2>
      </div>
      <button class="btn" id="detailClose" type="button">閉じる</button>
    </div>
    <div class="body">
      <div class="meta" id="detailMeta"></div>
      <div class="summary" id="detailSummary"></div>
      <div id="detailPhotos"></div>
      <div class="note">「社内担当者」「対応状況」を変更する場合は、スプレッドシートの該当行を直接編集してください（このページは閲覧専用です）。</div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* gas/Code.gs をデプロイした後のURL（.../exec）を設定してください。README.md参照 */
var GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycby3A8SC1FOxnVkloGa3YPX9U0LDtwEQCVEtyVxhBFzR9V9DqXTPLNncykenxI2HTmrZvw/exec";
var SESSION_KEY = "miyakobo_admin_pass_v1";

var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); };

var allRows = [];

function showGate(err){
  $("gate").style.display = "block";
  $("main").hidden = true;
  $("gateErr").textContent = err || "";
}
function showMain(){
  $("gate").style.display = "none";
  $("main").hidden = false;
}

function fetchList(pass){
  var url = GAS_WEBAPP_URL + "?mode=list&pass=" + encodeURIComponent(pass);
  return fetch(url).then(function(res){
    if(!res.ok) throw new Error("http_"+res.status);
    return res.json();
  }).then(function(json){
    if(!json || json.ok === false){
      var code = json && json.error;
      if(code === "unauthorized") throw new Error("パスワードが違います");
      throw new Error("読み込みに失敗しました（"+(code||"unknown")+"）");
    }
    return json.submissions || [];
  });
}

function tryOpen(pass){
  if(!GAS_WEBAPP_URL){ showGate("送信先が未設定です（管理者向け：admin.html の GAS_WEBAPP_URL を設定してください）"); return; }
  $("gateBtn").disabled = true;
  $("gateErr").textContent = "確認中…";
  fetchList(pass).then(function(rows){
    allRows = rows;
    try{ sessionStorage.setItem(SESSION_KEY, pass); }catch(e){}
    showMain();
    renderRows();
  }).catch(function(err){
    showGate(err.message || "読み込みに失敗しました");
  }).then(function(){
    $("gateBtn").disabled = false;
  });
}

$("gateBtn").addEventListener("click", function(){ tryOpen($("passInput").value); });
$("passInput").addEventListener("keydown", function(e){ if(e.key==="Enter") tryOpen($("passInput").value); });
$("logoutBtn").addEventListener("click", function(){
  try{ sessionStorage.removeItem(SESSION_KEY); }catch(e){}
  location.reload();
});
$("reloadBtn").addEventListener("click", function(){
  var pass = "";
  try{ pass = sessionStorage.getItem(SESSION_KEY) || ""; }catch(e){}
  if(pass) tryOpen(pass);
});

function currentFilter(){
  return {
    q: ($("searchInput").value||"").trim().toLowerCase()
  };
}

function renderRows(){
  var f = currentFilter();
  var rows = allRows.filter(function(r){
    if(f.q){
      var hay = [r.company,r.authorCompany,r.authorName,r.contact].join(" ").toLowerCase();
      if(hay.indexOf(f.q)===-1) return false;
    }
    return true;
  }).slice().sort(function(a,b){ return String(b.timestamp||"").localeCompare(String(a.timestamp||"")); });

  $("emptyMsg").hidden = rows.length>0;
  $("rows").innerHTML = rows.map(function(r,i){
    var d = r.timestamp ? new Date(r.timestamp) : null;
    var dstr = d && !isNaN(d) ? d.toLocaleString("ja-JP") : (r.timestamp||"");
    return '<tr data-i="'+i+'" data-id="'+esc(r.id||"")+'">'
      + '<td><b>'+esc(r.company||"（会社名未記入）")+'</b></td>'
      + '<td>'+esc(dstr)+'</td>'
      + '<td>'+esc(r.status||"未対応")+'</td>'
      + '<td>'+esc(r.assignee||"—")+'</td>'
      + '<td>'+esc(r.oneLineSummary||"")+'</td>'
      + '<td>'+esc(r.authorName||"")+'</td>'
      + '<td>'+esc(r.contact||"")+'</td>'
      + '</tr>';
  }).join("");
  $("listStatus").textContent = rows.length + " 件（全 " + allRows.length + " 件中）";

  Array.prototype.forEach.call($("rows").querySelectorAll("tr"), function(tr){
    tr.addEventListener("click", function(){
      var id = tr.getAttribute("data-id");
      var row = allRows.filter(function(r){ return String(r.id)===id; })[0];
      if(row) openDetail(row);
    });
  });
}
$("searchInput").addEventListener("input", renderRows);

function openDetail(r){
  var d = r.timestamp ? new Date(r.timestamp) : null;
  var dstr = d && !isNaN(d) ? d.toLocaleString("ja-JP") : (r.timestamp||"");
  $("detailKicker").textContent = dstr;
  $("detailTitle").textContent = r.company || r.authorCompany || "（会社名未記入）";
  $("detailMeta").innerHTML = [
    ["入力者会社名", r.authorCompany], ["入力者お名前", r.authorName],
    ["入力者メール", r.authorEmail], ["入力者電話番号", r.authorTel],
    ["会社名（案件）", r.company], ["ご担当者", r.contact],
    ["移転先所在地", r.address], ["入居希望", r.moveDate], ["予算", r.budget],
    ["社内担当者", r.assignee], ["対応状況", r.status || "未対応"]
  ].map(function(p){ return '<div><span>'+esc(p[0])+'</span>'+esc(p[1]||"—")+'</div>'; }).join("");
  $("detailSummary").textContent = (r.oneLineSummary ? "【ひとことまとめ】"+r.oneLineSummary+"\n\n" : "")
    + (r.summaryText || "（サマリーなし）");
  var attachNote = [r.photos, r.docs].filter(Boolean).join("、");
  $("detailPhotos").innerHTML = attachNote
    ? '<div class="note">添付ファイル（メールに添付済み）：'+esc(attachNote)+'</div>' : "";
  $("detailBackdrop").classList.add("open");
}
$("detailClose").addEventListener("click", function(){ $("detailBackdrop").classList.remove("open"); });
$("detailBackdrop").addEventListener("click", function(e){ if(e.target===$("detailBackdrop")) $("detailBackdrop").classList.remove("open"); });

/* 起動：このブラウザで既にパスワード確認済みなら自動的に開く */
(function(){
  var pass = "";
  try{ pass = sessionStorage.getItem(SESSION_KEY) || ""; }catch(e){}
  if(pass) tryOpen(pass); else showGate("");
})();

})();
</script>
</body>
</html>
