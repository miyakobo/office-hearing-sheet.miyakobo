<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEARING SHEET｜宮工房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  :root{
    --ink:#141414; --bg:#f2f2f3; --paper:#ffffff; --field:#f5f5f5;
    --line:rgba(20,20,20,.14); --line2:rgba(20,20,20,.24);
    --muted:#6b6b6b; --faint:#c2c2c2; --radius:10px; --danger:#b3382c;
    --head:"Barlow Condensed","Noto Sans JP",sans-serif;
    --body:"Barlow","Noto Sans JP",system-ui,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
  input,textarea,button{font:inherit;color:inherit}
  textarea{resize:vertical}
  ::selection{background:#e2e2e2}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  h1,h2{font-family:var(--head);font-weight:700;margin:0;letter-spacing:-.005em}

  .app{display:flex;flex-wrap:wrap;align-items:stretch;min-height:100vh}

  /* rail */
  .rail{flex:1 1 260px;max-width:288px;min-width:230px;border-right:1px solid var(--line);
        padding:24px 0 28px;position:sticky;top:0;align-self:flex-start;max-height:100vh;overflow:auto;background:var(--bg)}
  .rail .brand{padding:0 22px 18px;border-bottom:1px solid var(--line)}
  .brand-logo{display:block;height:16px;width:auto}
  .kicker{font-family:var(--head);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
  .rail .name{font-family:var(--head);font-weight:700;font-size:22px;line-height:1.2;margin-top:10px;letter-spacing:.02em}
  .count{display:flex;align-items:baseline;gap:7px;margin-top:14px;font-family:var(--head);line-height:1}
  .count b{font-size:27px;font-weight:700;font-variant-numeric:tabular-nums}
  .count span{font-size:12px;letter-spacing:.14em;color:var(--muted)}
  .steps{display:flex;flex-direction:column;padding-top:10px}
  .step{display:flex;align-items:center;gap:11px;padding:11px 22px;border:none;background:transparent;
        border-left:3px solid transparent;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
  .step:hover{background:var(--field)}
  .step.on{background:#e9e9ea;border-left-color:var(--ink)}
  .step .no{font-family:var(--head);font-size:14px;letter-spacing:.08em;font-variant-numeric:tabular-nums;color:#9a9a9a}
  .step.on .no{color:var(--ink)}
  .step .lbl{font-size:13px;line-height:1.35}
  .step .dot{margin-left:auto;width:8px;height:8px;flex:0 0 auto;border:1px solid var(--line2);border-radius:50%}
  .step.done .dot{background:var(--ink);border-color:var(--ink)}
  .step.send{margin-top:8px;border-top:1px solid var(--line)}

  /* main */
  main{flex:1 1 560px;min-width:0;display:flex;flex-direction:column;min-height:100vh}
  .stephead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
            padding:26px 34px 16px;border-bottom:1px solid var(--ink)}
  .stephead .hl{display:flex;align-items:baseline;gap:18px;min-width:0}
  .stephead .big{font-family:var(--head);font-size:56px;font-weight:700;line-height:.85;font-variant-numeric:tabular-nums}
  .stephead h1{font-size:31px;line-height:1.2;margin-top:2px}
  .content{flex:1 1 auto;padding:26px 34px 40px;max-width:1000px;width:100%}
  .hint{font-size:13.5px;color:var(--muted);margin-bottom:22px;max-width:64ch}

  /* buttons */
  .btn{border:1px solid var(--line2);background:transparent;color:var(--ink);padding:10px 20px;
       font-family:var(--head);font-size:14.5px;letter-spacing:.03em;cursor:pointer;border-radius:var(--radius)}
  .btn:hover{border-color:var(--ink)}
  .btn:disabled{border-color:var(--line);color:var(--faint);cursor:default}
  .btn-solid{background:var(--ink);border-color:var(--ink);color:#fafafa}
  .btn-solid:hover{background:#3a3a3a;border-color:#3a3a3a}
  .btn-sm{padding:6px 14px;font-size:13px}
  .btn-ghost{border-color:transparent;color:var(--muted)}
  .btn-ghost:hover{color:var(--ink)}

  /* fields */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px 22px}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0}
  .field.wide{grid-column:1/-1}
  .field>span{font-family:var(--head);font-size:12.5px;letter-spacing:.06em;color:#3a3a3a}
  .field input,.field textarea{border:1px solid transparent;background:var(--field);padding:11px 13px;
       font-size:15px;width:100%;border-radius:var(--radius)}
  .field input:hover,.field textarea:hover{border-color:var(--line2)}
  .field textarea{font-size:15px;line-height:1.75;min-height:120px}
  .sub{margin-top:28px;padding-top:22px;border-top:1px dashed var(--line)}
  .fieldnote{font-size:11.5px;color:var(--muted);margin-top:1px}

  /* chip groups (pill toggles) */
  .chipgroup{margin-top:26px}
  .chips{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
  .chip{display:inline-flex;align-items:center;padding:10px 20px;font-size:14.5px;
        cursor:pointer;user-select:none;border:1px solid var(--line2);border-radius:999px;background:transparent}
  .chip:hover{border-color:var(--ink)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fafafa}
  .chip input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
  .chip-other{width:220px;min-height:42px;border:1px solid var(--line2);background:var(--field);
              padding:10px 16px;font-size:14.5px;border-radius:999px}
  .grouplabel{font-family:var(--head);font-size:12.5px;letter-spacing:.06em;color:#3a3a3a;margin-bottom:10px}
  .req{color:var(--danger);font-weight:700;font-size:11px;margin-left:4px;letter-spacing:.02em}
  .field.invalid input,.field.invalid textarea{border-color:var(--danger)}
  .field.invalid>span{color:var(--danger)}
  .chipgroup.invalid .grouplabel{color:var(--danger)}

  /* checks (rows) */
  .checkslabel{font-family:var(--head);font-size:12.5px;letter-spacing:.06em;color:#3a3a3a;margin:28px 0 10px}
  .checks{columns:2 320px;column-gap:16px}
  .check-wrap{break-inside:avoid;margin:0 0 12px;border:1px solid var(--line);border-radius:var(--radius)}
  .check-wrap.on{border-color:var(--ink)}
  .check{display:flex;align-items:center;gap:13px;padding:13px 14px;cursor:pointer;min-width:0}
  .check.on{background:#eaeaea;border-radius:var(--radius)}
  .check input[type=checkbox]{width:17px;height:17px;margin:0;flex:0 0 auto;accent-color:var(--ink);cursor:pointer}
  .check .txt{font-size:14.5px}
  .qtys{margin-left:auto;display:flex;gap:10px;flex:0 0 auto}
  .qty{display:inline-flex;align-items:center;gap:5px}
  .qty input{width:58px;border:1px solid var(--line2);background:var(--paper);padding:5px 7px;
             font-size:13.5px;text-align:right;border-radius:6px}
  .qty input:disabled{opacity:.35}
  .qty span{font-size:11.5px;color:var(--muted);white-space:nowrap}

  .rooms{padding:0 14px 12px 44px;display:flex;flex-direction:column;gap:8px}
  .room-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .room-del{border:1px solid var(--line2);background:transparent;width:24px;height:24px;font-size:13px;
            line-height:1;cursor:pointer;flex:0 0 auto;color:var(--ink);border-radius:6px}
  .room-del:hover{border-color:var(--ink)}
  .room-add{align-self:flex-start;border:1px dashed var(--line2);background:transparent;padding:6px 13px;
            font-size:12.5px;cursor:pointer;font-family:var(--head);letter-spacing:.04em;color:var(--ink);border-radius:6px}
  .room-add:hover{border-color:var(--ink);background:var(--field)}

  /* moods */
  .moods{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}
  .mood{position:relative;display:block;cursor:pointer;background:transparent;border:1px solid var(--line2);
        border-radius:var(--radius);overflow:hidden;padding:0;text-align:left}
  .mood input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;z-index:2;cursor:pointer}
  .mood.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
  .mood .imgs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line2)}
  .mood .imgs img{display:block;width:100%;height:120px;object-fit:cover}
  .mood .cap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px 12px;
             font-size:14px;border-top:1px solid var(--line2)}
  .mood.on .cap{font-weight:700;border-top-color:var(--ink)}
  .mood .mark{width:15px;height:15px;flex:0 0 auto;border:1px solid var(--faint);border-radius:50%}
  .mood.on .mark{background:var(--ink);border-color:var(--ink)}

  /* photos / docs attach */
  .photos{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
  .photo-add{display:inline-flex;align-items:center;justify-content:center;width:100px;height:100px;
             border:1px dashed var(--faint);font-size:12.5px;cursor:pointer;flex:0 0 auto;text-align:center;
             border-radius:var(--radius);line-height:1.4}
  .photo-add:hover{background:var(--field)}
  .photo{position:relative;width:100px;height:100px;border:1px solid var(--line2);flex:0 0 auto;
         background-size:cover;background-position:center;filter:grayscale(1);border-radius:var(--radius);overflow:hidden}
  .photo button{position:absolute;top:0;right:0;width:24px;height:24px;background:var(--ink);color:#fafafa;
                border:none;font-size:13px;line-height:1;cursor:pointer}
  .note{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.7}
  .docs{display:flex;flex-direction:column;gap:8px;max-width:560px}
  .doc-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);padding:10px 12px;border-radius:var(--radius)}
  .doc-row .dname{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto}
  .doc-row .dsize{font-size:11.5px;color:var(--muted);white-space:nowrap}
  .doc-row button{border:1px solid var(--line2);background:transparent;width:24px;height:24px;font-size:13px;
                   line-height:1;cursor:pointer;color:var(--ink);border-radius:6px;flex:0 0 auto}
  .doc-add{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px;
           border:1px dashed var(--faint);font-size:13.5px;cursor:pointer;text-align:center;border-radius:var(--radius)}
  .doc-add:hover{background:var(--field)}

  /* spec panel */
  .spec{position:relative;background:var(--paper);color:var(--ink);padding:24px;border:1px solid var(--ink);border-radius:var(--radius)}
  .spec .head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
              border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
  .spec h2{font-size:22px}
  .spec .head .en{font-family:var(--head);font-size:11px;letter-spacing:.2em;color:var(--muted)}
  .spec textarea{background:transparent;border:none;color:var(--ink);padding:0;width:100%;
       font-family:ui-monospace,"SFMono-Regular",Menlo,"Noto Sans JP",monospace;font-size:13px;line-height:1.9;
       min-height:44vh;white-space:pre-wrap}
  .status{font-size:12.5px;min-height:18px;line-height:1.6;color:var(--muted)}
  .status.ok,.status.err{color:var(--ink);font-weight:700}

  .banner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
          border:1px solid var(--ink);background:var(--paper);padding:12px 16px;font-size:13px;margin-bottom:26px;border-radius:var(--radius)}

  /* footer nav */
  .navbar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);
          padding:14px 34px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .ticks{display:flex;gap:3px}
  .tick{width:20px;height:6px;border:1px solid var(--line2);border-radius:3px}
  .tick.done{background:var(--ink);border-color:var(--ink)}
  .tick.on{background:var(--ink);border-color:var(--ink);height:9px}
  .stepno{font-family:var(--head);font-size:13px;letter-spacing:.12em;color:var(--muted);font-variant-numeric:tabular-nums}

  /* drawer */
  .backdrop{position:fixed;inset:0;background:rgba(20,20,20,.45);z-index:40;display:none;justify-content:flex-end}
  .backdrop.open{display:flex}
  .drawer{width:min(460px,92vw);height:100%;background:var(--paper);color:var(--ink);padding:24px;
          display:flex;flex-direction:column;gap:14px;overflow:auto;border-left:1px solid var(--ink)}
  .drawer textarea{flex:1 1 auto;background:transparent;border:none;color:var(--ink);padding:0;width:100%;
       font-family:ui-monospace,"SFMono-Regular",Menlo,"Noto Sans JP",monospace;font-size:12.5px;line-height:1.9;resize:none}
  .btn-inv{background:transparent;border:1px solid var(--line2);color:var(--ink);padding:11px;
           font-family:var(--head);font-size:14px;cursor:pointer;border-radius:var(--radius)}
  .btn-inv:hover{border-color:var(--ink)}

  @media (max-width:720px){
    .stephead{padding:20px 18px 12px} .content{padding:20px 18px 32px} .navbar{padding:12px 18px}
  }
</style>
</head>
<body>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <img class="brand-logo" src="assets/logo.svg" alt="Miyakobo" width="150" height="22">
      <div class="name">HEARING SHEET</div>
      <div class="count"><b id="filledCount">00</b><span id="stepTotalLbl">/ 06 記入済</span></div>
    </div>
    <nav class="steps" id="steps"></nav>
  </aside>

  <main>
    <header class="stephead">
      <div class="hl">
        <span class="big" id="stepNo">00</span>
        <div>
          <div class="kicker" id="stepEn"></div>
          <h1 id="stepTitle"></h1>
        </div>
      </div>
      <button class="btn" id="drawerBtn" type="button">要件サマリーを見る</button>
    </header>

    <div class="content" id="content"></div>

    <footer class="navbar">
      <button class="btn" id="prevBtn" type="button">← 戻る</button>
      <div style="display:flex;align-items:center;gap:14px">
        <div class="ticks" id="ticks"></div>
        <span class="stepno" id="stepLabel"></span>
      </div>
      <button class="btn" id="nextBtn" type="button">次へ →</button>
    </footer>
  </main>
</div>

<div class="backdrop" id="backdrop">
  <div class="drawer" id="drawer">
    <div class="spec head" style="background:transparent;border:none;padding:0">
      <h2>要件サマリー</h2>
      <button class="btn-inv" style="padding:5px 12px;font-size:13px" id="drawerClose" type="button">閉じる</button>
    </div>
    <textarea id="drawerText" readonly placeholder="チェックを入れると、ここに要件がまとまっていきます。"></textarea>
    <button class="btn-inv" id="drawerCopy" type="button">コピー</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* ─────────────────────────────────────────────
   0. 送信先の設定
   Apps ScriptのWeb App URL（gas/Code.gs をデプロイした後に発行される、.../exec で終わるもの）
   ───────────────────────────────────────────── */
var GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycby3A8SC1FOxnVkloGa3YPX9U0LDtwEQCVEtyVxhBFzR9V9DqXTPLNncykenxI2HTmrZvw/exec";

/* ─────────────────────────────────────────────
   1. 項目の定義（ここを編集すれば設問が変わります）
   セクションに「detail」を付けると、「＋ 詳しく入力する（任意）」で開閉できる
   追加設問のブロックになります（必須ではない、より詳しい質問向け）。
   ───────────────────────────────────────────── */
var SECTIONS = [
  { id:"author", no:"00", en:"YOUR INFORMATION", title:"入力者情報",
    hint:"ご記入者さまの情報をご入力ください。すべて必須項目です。",
    fields:[
      {key:"authorCompany",label:"会社名",ph:"例：株式会社〇〇",req:true},
      {key:"authorName",label:"お名前",ph:"例：山田 太郎",req:true},
      {key:"authorEmail",label:"メールアドレス",type:"email",ph:"例：name@example.com",req:true,
        note:"送信内容の控えを、このアドレス宛にもお送りします"},
      {key:"authorTel",label:"電話番号",type:"tel",ph:"例：03-1234-5678",req:true}
    ] },

  { id:"overview", no:"01", en:"PROJECT", title:"プロジェクト概要",
    fields:[
      {key:"company",label:"会社名",ph:"例：ミライ商事株式会社"},
      {key:"contact",label:"ご担当者名・役職",ph:"例：総務部 山田様"},
      {key:"address",label:"移転先のオフィス所在地",wide:true,ph:"例：東京都千代田区〇〇1-2-3"},
      {key:"moveDate",label:"入居希望日・移転期限",ph:"例：2027年4月"},
      {key:"budget",label:"想定予算",ph:"例：5,000万円"},
      {key:"sizeNote",label:"想定面積",ph:"例：800坪"}
    ],
    chipGroups:[
      {group:"projectType",mode:"radio",label:"プロジェクト種別",items:["移転","増床","改装（現オフィス）","その他"]}
    ],
    detail:{
      label:"移転の経緯・優先要件",
      checks:{group:"background",label:"検討のきっかけ（複数選択いただけます）",items:[
        {value:"人員増加"},{value:"オフィスの老朽化・設備劣化"},
        {value:"賃料・固定費の見直し"},{value:"ブランドイメージの強化"},
        {value:"社員のコミュニケーション活性化"},{value:"出社率・オフィス回帰の促進"},
        {value:"採用の強化"},{value:"セキュリティの強化"}]},
      checks2:{group:"priorities",label:"特に重視される点（複数選択いただけます）",items:[
        {value:"予算"},{value:"スケジュール"},
        {value:"デザイン性・ブランド表現"},{value:"機能性・使いやすさ"},
        {value:"セキュリティ"},{value:"座席優先"}]},
      fields:[
        {key:"backgroundOther",label:"検討の背景　その他（自由記述）",wide:true},
        {key:"priorityOther",label:"優先要件　その他（自由記述）",wide:true}]
    } },

  { id:"people", no:"02", en:"HEADCOUNT", title:"人員・座席",
    fields:[
      {key:"headNow",label:"現在の人数",type:"number",ph:"名"},
      {key:"headMove",label:"入居時の想定人数",type:"number",ph:"名"},
      {key:"headFuture",label:"将来（3年後目安）の想定人数",type:"number",ph:"名"}],
    chipGroups:[
      {group:"seatType",mode:"multi",label:"座席タイプ（複数選択可）",items:["固定席中心","フリーアドレス","個室中心"]}
    ],
    note:"※机サイズのご希望がない場合は、1人あたりW1200×D600mmで製作いたします。ご希望があれば「詳しく入力する」からご記入ください。",
    detail:{
      label:"机サイズ",
      chipGroups:[
        {group:"deskNone",mode:"multi",label:"希望の机サイズ（1人分）",items:["特になし"]},
        {group:"deskW",mode:"toggle",label:"W（mm）",items:["1000","1200","1400"],otherKey:"deskWOther",otherPh:"その他（例：1600）"},
        {group:"deskD",mode:"toggle",label:"D（mm）",items:["600","700"],otherKey:"deskDOther",otherPh:"その他（例：800）"}
      ],
      fields:[{key:"seatTypeOther",label:"座席タイプ　その他（自由記述）",wide:true}]
    } },

  { id:"image", no:"03", en:"IMAGE", title:"求める空間イメージ",
    hint:"イメージに近いものをお選びください（複数選択いただけます）",
    moods:[
      {value:"ラグジュアリーオフィス",caption:"ラグジュアリー",images:["photos/mood-1.webp","photos/mood-2.webp"]},
      {value:"ナチュラル",caption:"ナチュラル",images:["photos/mood-3.webp","photos/mood-4.webp"]},
      {value:"先進的",caption:"先進的",images:["photos/mood-5.webp","photos/mood-6.webp"]},
      {value:"モノトーン",caption:"モノトーン",images:["photos/mood-7.webp","photos/mood-8.webp"]},
      {value:"ポップ",caption:"ポップ",images:["photos/mood-9.jpg","photos/mood-10.jpg"]},
      {value:"特になし",caption:"特になし",images:[]}],
    photos:true,
    detail:{ label:"言葉でのご指定", fields:[{key:"imageOther",label:"その他（言葉でのご指定）",wide:true,ph:"近いものがなければ、言葉でご記入ください"}] } },

  { id:"areas", no:"04", en:"PROGRAM", title:"必要な機能・設備",
    hint:"ご入用の項目をお選びのうえ、数量がお決まりでしたらご入力ください",
    checks:{group:"areas",items:[
      {value:"エントランス・受付"},
      {value:"会議室",rooms:{key:"meeting",fields:[{k:"cap",unit:"名用",ph:"10"},{k:"count",unit:"室",ph:"1"}]}},
      {value:"フォンブース",rooms:{key:"phoneBooth",fields:[{k:"cap",unit:"名用",ph:"1"},{k:"count",unit:"個",ph:"2"}]}},
      {value:"集中ワークブース"},{value:"リフレッシュ・カフェスペース"},
      {value:"役員室・応接室"},{value:"サーバー・IT機器室"},
      {value:"倉庫・書庫・ロッカー",rooms:{key:"storage",fields:[
        {k:"w",pre:"W",unit:"mm",ph:"900"},{k:"d",pre:"D",unit:"mm",ph:"450"},{k:"count",unit:"個",ph:"1"}]}}
    ]},
    detail:{
      label:"設備・技術要件",
      checks:{group:"equipment",label:"設備・技術要件（複数選択いただけます）",items:[
        {value:"入退室管理・セキュリティゲート"},{value:"防音・音響対策"},
        {value:"個別空調・温度管理"},{value:"環境配慮設備（断熱・省エネ等）"},{value:"バリアフリー対応"},
        {value:"特になし"}]},
      fields:[
        {key:"areaOther",label:"その他のエリア",wide:true},
        {key:"equipmentOther",label:"設備　その他（自由記述）",wide:true}]
    } },

  { id:"notes", no:"05", en:"NOTES", title:"特記事項・物件資料",
    fields:[
      {key:"testFitDate",label:"テストフィット希望日",type:"date",note:"※都合によって日程前後する場合ございます"}],
    checks:{group:"drawings",label:"図面データの有無",items:[
      {value:"CADデータあり"},{value:"PDF図面のみ"},{value:"図面なし"}]},
    docs:true,
    tail:[{key:"notes",label:"面談メモ・特記事項",type:"textarea",wide:true,ph:"補足事項や気になる点などを自由にご記入ください"}] }
];

var REVIEW_STEP = SECTIONS.length;
var STEP_TOTAL = SECTIONS.length + 1;

var MOOD_GROUP = "imageKeywords";
var STORAGE_KEY = "miyakobo_office_hearing_checksheet_v5";
var MAX_IMAGES = 5, MAX_IMAGE_BYTES = 8*1024*1024;
var MAX_DOCS = 5, MAX_DOC_BYTES = 10*1024*1024;

/* ─────────────────────────────────────────────
   2. 状態
   ───────────────────────────────────────────── */
var state = null, step = 0, photos = [], docs = [], submitting = false;
var invalidKeys = [];
var expandedSections = {}; // 「詳しく入力する」の開閉状態（保存はしない・一時的なUI状態）

var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); };

function emptyState(){ return {checks:{},radio:{},text:{},rooms:{}}; }

function load(){
  try{ var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ var p = JSON.parse(raw); if(p && p.checks && p.text){ p.rooms = p.rooms || {}; p.radio = p.radio || {}; return p; } } }catch(e){}
  return null;
}
function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }

function allChipGroups(sec){ return sec.chipGroups || []; }

function allChecksSpecs(){
  var out = [];
  SECTIONS.forEach(function(s){
    if(s.checks) out.push(s.checks);
    if(s.detail){
      if(s.detail.checks) out.push(s.detail.checks);
      if(s.detail.checks2) out.push(s.detail.checks2);
    }
  });
  return out;
}

function getRequiredIssues(){
  var issues = [];
  if(!(state.text.authorCompany||"").trim()) issues.push("authorCompany");
  if(!(state.text.authorName||"").trim()) issues.push("authorName");
  var email = (state.text.authorEmail||"").trim();
  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) issues.push("authorEmail");
  if(!(state.text.authorTel||"").trim()) issues.push("authorTel");
  return issues;
}

function filledSection(sec){
  var t = state.text;
  var has = function(k){ return !!(t[k] && String(t[k]).trim()); };
  var any = function(arr){ return (arr||[]).some(function(f){ return has(f.key); }); };
  var parts = [sec, sec.detail || {}];
  for(var i=0;i<parts.length;i++){
    var p = parts[i];
    if(any(p.fields) || any(p.tail)) return true;
    var groups = p.chipGroups || [];
    if(groups.some(function(g){ return g.mode==="radio" ? !!state.radio[g.group] : (state.checks[g.group]||[]).length>0; })) return true;
    if(groups.some(function(g){ return g.otherKey && has(g.otherKey); })) return true;
    if(p.checks && (state.checks[p.checks.group]||[]).length) return true;
    if(p.checks2 && (state.checks[p.checks2.group]||[]).length) return true;
  }
  if(sec.moods && (state.checks[MOOD_GROUP]||[]).length) return true;
  return false;
}

/* ─────────────────────────────────────────────
   3. サマリー文の生成
   ───────────────────────────────────────────── */
function bulletBlock(title, items){
  if(!items || !items.length) return "";
  return "■ " + title + "\n" + items.map(function(i){ return "・" + i; }).join("\n");
}
function buildSummary(){
  var t = state.text, c = state.checks, radio = state.radio, rooms = state.rooms, blocks = [];

  var au = [];
  if(t.authorCompany) au.push("会社名："+t.authorCompany);
  if(t.authorName) au.push("お名前："+t.authorName);
  if(t.authorEmail) au.push("メール："+t.authorEmail);
  if(t.authorTel) au.push("電話："+t.authorTel);
  if(au.length) blocks.push("■ 入力者情報\n"+au.join("\n"));

  var ov = [], head = t.company || "";
  if(head) ov.push(head);
  var who = [t.contact?"ご担当："+t.contact:"", t.address?"移転先："+t.address:""].filter(Boolean).join("　");
  if(who) ov.push(who);
  var meta = [];
  if(radio.projectType) meta.push("種別："+radio.projectType);
  if(t.moveDate) meta.push("入居希望："+t.moveDate);
  if(t.budget) meta.push("予算："+t.budget);
  if(t.sizeNote) meta.push("面積："+t.sizeNote);
  if(meta.length) ov.push(meta.join("　"));
  if(ov.length) blocks.push("■ 案件概要\n"+ov.join("\n"));

  var bg = (c.background||[]).slice();
  if(t.backgroundOther) bg.push(t.backgroundOther+"（自由記述）");
  if(bulletBlock("検討の背景",bg)) blocks.push(bulletBlock("検討の背景",bg));

  var hc = [];
  if(t.headNow) hc.push("現在"+t.headNow+"名");
  if(t.headMove) hc.push("入居時"+t.headMove+"名");
  if(t.headFuture) hc.push("将来(3年後目安)"+t.headFuture+"名");
  var seats = (c.seatType||[]).slice();
  if(t.seatTypeOther) seats.push(t.seatTypeOther);
  var pl = [];
  if(hc.length) pl.push(hc.join(" → "));
  if(seats.length) pl.push("座席タイプ："+seats.join("、"));
  if((c.deskNone||[]).length){
    pl.push("机サイズ：特になし");
  } else {
    var ws = (c.deskW||[]).slice(); if(t.deskWOther) ws.push(t.deskWOther);
    var ds = (c.deskD||[]).slice(); if(t.deskDOther) ds.push(t.deskDOther);
    var desk = [];
    if(ws.length) desk.push("W"+ws.join("/"));
    if(ds.length) desk.push("D"+ds.join("/"));
    if(desk.length) pl.push("希望の机サイズ（1人分）："+desk.join(" × ")+"mm");
    else pl.push("希望の机サイズ（1人分）：W1200×D600mm（標準サイズで製作）");
  }
  if(pl.length) blocks.push("■ 人員・座席\n"+pl.join("\n"));

  var img = (c[MOOD_GROUP]||[]).slice().filter(function(v){ return v!=="特になし"; }), il = [];
  if((c[MOOD_GROUP]||[]).indexOf("特になし")!==-1 && !img.length) il.push("特になし");
  if(img.length) il.push(img.join("、"));
  if(t.imageOther) il.push("参考・その他："+t.imageOther);
  if(il.length) blocks.push("■ 求める空間イメージ\n"+il.join("\n"));

  function roomsSummary(name, rows, capUnit, countUnit){
    var list = (rows||[]).filter(function(r){ return r && (r.cap || r.count); });
    if(!list.length) return name;
    var parts = list.map(function(r){
      var p = [];
      if(r.cap) p.push(r.cap+capUnit);
      if(r.count) p.push(r.count+countUnit);
      return p.join("・");
    });
    return name+"（"+parts.join("、")+"）";
  }
  function storageSummary(rows){
    var list = (rows||[]).filter(function(r){ return r && (r.w||r.d||r.count); });
    if(!list.length) return "倉庫・書庫・ロッカー";
    var parts = list.map(function(r){
      var size = [r.w?"W"+r.w:"",r.d?"D"+r.d:""].filter(Boolean).join(" × ");
      return [size?size+"mm":"", r.count?r.count+"個":""].filter(Boolean).join(" ");
    });
    return "倉庫・書庫・ロッカー（"+parts.join("、")+"）";
  }
  var areaItems = (c.areas||[]).map(function(a){
    if(a==="会議室") return roomsSummary(a, rooms.meeting, "名用", "室");
    if(a==="フォンブース") return roomsSummary(a, rooms.phoneBooth, "名用", "個");
    if(a==="倉庫・書庫・ロッカー") return storageSummary(rooms.storage);
    return a;
  });
  if(t.areaOther) areaItems.push(t.areaOther);
  if(bulletBlock("必要な機能・エリア",areaItems)) blocks.push(bulletBlock("必要な機能・エリア",areaItems));

  var eq = (c.equipment||[]).slice();
  if(t.equipmentOther) eq.push(t.equipmentOther+"（自由記述）");
  if(bulletBlock("設備・技術要件",eq)) blocks.push(bulletBlock("設備・技術要件",eq));

  var pr = (c.priorities||[]).slice();
  if(t.priorityOther) pr.push(t.priorityOther+"（自由記述）");
  if(bulletBlock("優先要件",pr)) blocks.push(bulletBlock("優先要件",pr));

  var docLines = (c.drawings||[]).slice();
  docs.forEach(function(f){ docLines.push("添付："+f.name); });
  if(bulletBlock("物件資料",docLines)) blocks.push(bulletBlock("物件資料",docLines));

  if(t.notes) blocks.push("■ その他メモ\n"+t.notes);
  if(t.testFitDate) blocks.push("■ 図面希望日\nテストフィット希望日："+t.testFitDate);
  return blocks.join("\n\n");
}

/* ─────────────────────────────────────────────
   4. 描画
   ───────────────────────────────────────────── */
function fieldHtml(f){
  var v = esc(state.text[f.key]==null ? "" : state.text[f.key]);
  var ph = esc(f.ph||"");
  var inner = f.type === "textarea"
    ? '<textarea data-key="'+f.key+'" rows="5" placeholder="'+ph+'">'+v+'</textarea>'
    : '<input type="'+(f.type||"text")+'" data-key="'+f.key+'" value="'+v+'" placeholder="'+ph+'">';
  var note = f.note ? '<small class="fieldnote">'+esc(f.note)+'</small>' : '';
  var invalid = f.req && invalidKeys.indexOf(f.key)!==-1;
  return '<label class="field'+(f.wide?" wide":"")+(invalid?" invalid":"")+'"><span>'+esc(f.label)
    + (f.req?' <b class="req">＊必須</b>':'')+'</span>'+inner+note+'</label>';
}

function chipGroupHtml(g){
  var isRadio = g.mode === "radio";
  var otherVal = g.otherKey ? esc(state.text[g.otherKey]==null?"":state.text[g.otherKey]) : "";
  var invalid = g.req && invalidKeys.indexOf(g.group)!==-1;
  return '<div class="chipgroup'+(invalid?" invalid":"")+'">'
    + (g.label ? '<div class="grouplabel">'+esc(g.label)+(g.req?' <b class="req">＊必須</b>':'')+'</div>' : "")
    + '<div class="chips">'
    + g.items.map(function(v){
        var on = isRadio ? state.radio[g.group]===v : (state.checks[g.group]||[]).indexOf(v)!==-1;
        return '<label class="chip'+(on?" on":"")+'">'
          + '<input type="'+(isRadio?"radio":"checkbox")+'" name="'+g.group+'" data-chip="'+g.group+'" data-mode="'
          + g.mode+'" value="'+esc(v)+'"'+(on?" checked":"")+'><span>'+esc(v)+'</span></label>';
      }).join("")
    + (g.otherKey ? '<input class="chip-other" type="text" data-key="'+g.otherKey+'" value="'+otherVal+'" placeholder="'+esc(g.otherPh||"その他")+'">' : "")
    + '</div>'
    + (g.note ? '<div class="fieldnote" style="margin-top:8px">'+esc(g.note)+'</div>' : "")
    + '</div>';
}

function checksBlockHtml(spec){
  if(!spec) return "";
  var cg = spec.group, list = state.checks[cg]||[];
  var h = "";
  if(spec.label) h += '<div class="checkslabel">'+esc(spec.label)+'</div>';
  h += '<div class="checks">'
    + spec.items.map(function(it){
        var on = list.indexOf(it.value)!==-1;
        if(it.rooms){
          var rk = it.rooms.key, rf = it.rooms.fields;
          var rows = (state.rooms[rk] && state.rooms[rk].length) ? state.rooms[rk] : [{}];
          var rowsHtml = rows.map(function(r,idx){
            var cells = rf.map(function(f){
              var val = esc(r[f.k]||"");
              var phText = (f.pre||"")+f.ph;
              return '<span class="qty"><input type="number" data-room="'+rk+'" data-idx="'+idx+'" data-field="'+f.k+'" value="'
                + val+'" placeholder="'+esc(phText)+'"'+(on?"":" disabled")+'><span>'+esc(f.unit)+'</span></span>';
            }).join("");
            return '<div class="room-row">'+cells
              + (on && rows.length>1 ? '<button type="button" class="room-del" data-room="'+rk+'" data-idx="'+idx+'" aria-label="この行を削除">×</button>' : '')
              + '</div>';
          }).join("");
          return '<div class="check-wrap'+(on?" on":"")+'">'
            + '<label class="check'+(on?" on":"")+'">'
            +   '<input type="checkbox" data-group="'+cg+'" value="'+esc(it.value)+'"'+(on?" checked":"")+'>'
            +   '<span class="txt">'+esc(it.value)+'</span>'
            + '</label>'
            + '<div class="rooms">'+rowsHtml
            +   (on ? '<button type="button" class="room-add" data-room="'+rk+'">＋ 追加</button>' : '')
            + '</div>'
            + '</div>';
        }
        return '<label class="check'+(on?" on":"")+'">'
          + '<input type="checkbox" data-group="'+cg+'" value="'+esc(it.value)+'"'+(on?" checked":"")+'>'
          + '<span class="txt">'+esc(it.value)+'</span>'
          + '</label>';
      }).join("")
    + '</div>';
  return h;
}

function sectionHtml(sec){
  var h = "";
  if(sec.hint) h += '<div class="hint">'+esc(sec.hint)+'</div>';
  if(sec.id==="author" && invalidKeys.length){
    h += '<div class="hint" style="color:var(--danger);font-weight:700">'
      + '※ 会社名・お名前・メールアドレス・電話番号は必須項目です。ご入力のうえお進みください。</div>';
  }

  if(sec.fields) h += '<div class="grid">'+sec.fields.map(fieldHtml).join("")+'</div>';
  allChipGroups(sec).forEach(function(g){ h += chipGroupHtml(g); });
  if(sec.checks) h += checksBlockHtml(sec.checks);

  if(sec.moods){
    var ml = state.checks[MOOD_GROUP]||[];
    h += '<div class="moods">'
      + sec.moods.map(function(m){
          var on = ml.indexOf(m.value)!==-1;
          return '<label class="mood'+(on?" on":"")+'">'
            + '<input type="checkbox" data-group="'+MOOD_GROUP+'" value="'+esc(m.value)+'"'+(on?" checked":"")+'>'
            + '<span class="imgs">'+m.images.map(function(src){ return '<img src="'+esc(src)+'" alt="">'; }).join("")+'</span>'
            + '<span class="cap"><span>'+esc(m.caption)+'</span><span class="mark"></span></span></label>';
        }).join("")
      + '</div>';
  }

  if(sec.photos){
    h += '<div style="margin-top:28px"><div class="grouplabel">イメージに近い参考写真をお持ちでしたら、ご添付ください</div>'
      + '<div class="photos" id="photos"><label class="photo-add" for="photoInput">＋ 写真を<br>添付する</label>'
      + '<input id="photoInput" type="file" accept="image/*" multiple hidden></div>'
      + '<div class="note">ご送信いただくと、そのままメールに添付されます（5枚まで・1枚8MBまで）</div></div>';
  }

  if(sec.docs){
    h += '<div style="margin-top:28px"><div class="grouplabel">物件情報（PDF・CADデータ）をお持ちでしたら、ご添付ください</div>'
      + '<div class="docs" id="docs">'
      + '<label class="doc-add" for="docInput">＋ ファイルを添付する（PDF・DWG・DXF・JWW）</label>'
      + '<input id="docInput" type="file" accept=".pdf,.dwg,.dxf,.jww,application/pdf" multiple hidden></div>'
      + '<div class="note">ご送信いただくと、そのままメールに添付されます（5件まで・1件10MBまで）</div></div>';
  }

  if(sec.note) h += '<div class="hint" style="margin-top:22px;margin-bottom:0">'+esc(sec.note)+'</div>';

  if(sec.detail){
    var open = !!expandedSections[sec.id];
    var label = open ? "－ 閉じる" : "＋ 詳しく入力する"+(sec.detail.label?"（任意："+sec.detail.label+"）":"（任意）");
    h += '<div style="margin-top:22px"><button type="button" class="btn" data-detail-toggle="'+sec.id+'">'+esc(label)+'</button></div>';
    if(open){
      var d = sec.detail;
      h += '<div class="sub">';
      if(d.fields) h += '<div class="grid">'+d.fields.map(fieldHtml).join("")+'</div>';
      (d.chipGroups||[]).forEach(function(g){ h += chipGroupHtml(g); });
      if(d.checks) h += checksBlockHtml(d.checks);
      if(d.checks2) h += checksBlockHtml(d.checks2);
      h += '</div>';
    }
  }

  if(sec.tail) h += '<div class="grid sub">'+sec.tail.map(fieldHtml).join("")+'</div>';
  return h;
}

function reviewHtml(){
  var s = buildSummary();
  return '<div style="display:flex;flex-direction:column;gap:18px">'
    + '<div class="hint" style="margin:0">ご入力いただいた内容を、下記のとおりまとめております。内容をご確認のうえ、ご送信ください。</div>'
    + '<div class="spec"><div class="head"><h2>要件サマリー</h2><span class="en">Requirement Spec</span></div>'
    +   '<textarea id="summaryText" readonly placeholder="チェックを入れると、ここに要件がまとまっていきます。">'+esc(s)+'</textarea>'
    + '</div>'
    + '<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">'
    +   '<button class="btn btn-solid" id="submitBtn" type="button" style="flex:1 1 320px;padding:16px 18px;font-size:16px">'+(submitting?"送信中…":"送信")+'</button>'
    +   '<button class="btn" id="copyBtn" type="button" style="padding:16px 22px">コピー</button>'
    +   '<button class="btn btn-ghost" id="resetBtn" type="button" style="padding:16px 18px">クリア</button>'
    + '</div>'
    + '<div class="status" id="submitStatus" aria-live="polite"></div>'
    + '<div class="note">ご入力内容はこの端末にのみ自動保存されます。ご送信いただくと、要件サマリーが担当者へメールで届き、記録として保存されます。</div>'
    + '</div>';
}

function renderRail(){
  var html = SECTIONS.map(function(s,i){
    return '<button class="step'+(i===step?" on":"")+(filledSection(s)?" done":"")+'" data-i="'+i+'" type="button">'
      + '<span class="no">'+s.no+'</span><span class="lbl">'+esc(s.title)+'</span><span class="dot"></span></button>';
  }).join("");
  html += '<button class="step send'+(step===REVIEW_STEP?" on":"")+'" data-i="'+REVIEW_STEP+'" type="button">'
       + '<span class="no">→</span><span class="lbl">確認して送信</span><span class="dot"></span></button>';
  $("steps").innerHTML = html;
  $("filledCount").textContent = String(SECTIONS.filter(filledSection).length).padStart(2,"0");
  $("stepTotalLbl").textContent = "/ "+String(SECTIONS.length).padStart(2,"0")+" 記入済";

  $("ticks").innerHTML = SECTIONS.concat([{}]).map(function(s,i){
    var cls = "tick" + (i===step?" on":(SECTIONS[i]&&filledSection(SECTIONS[i])?" done":""));
    return '<span class="'+cls+'"></span>';
  }).join("");
  $("stepLabel").textContent = String(step+1).padStart(2,"0")+" / "+String(STEP_TOTAL).padStart(2,"0");
  $("prevBtn").disabled = step===0;
  $("nextBtn").disabled = step===REVIEW_STEP;
  $("nextBtn").textContent = (step===REVIEW_STEP-1?"確認へ":"次へ")+" →";
}

function render(){
  if(invalidKeys.length) invalidKeys = getRequiredIssues();
  var isReview = step===REVIEW_STEP, sec = SECTIONS[step];
  $("stepNo").textContent = isReview ? "→" : sec.no;
  $("stepEn").textContent = isReview ? "Review & Send" : sec.en;
  $("stepTitle").textContent = isReview ? "確認して送信" : sec.title;

  $("content").innerHTML = isReview ? reviewHtml() : sectionHtml(sec);
  if(sec && sec.photos) renderPhotos();
  if(sec && sec.docs) renderDocs();
  renderRail();
  $("drawerText").value = buildSummary();
}

/* ─────────────────────────────────────────────
   5. 入力ハンドリング
   ───────────────────────────────────────────── */
function onChange(e){
  var el = e.target;
  if(el.matches('input[data-group]')){
    var g = el.getAttribute("data-group"), v = el.value;
    var list = (state.checks[g]||[]).slice(), i = list.indexOf(v);
    if(el.checked && i===-1) list.push(v);
    if(!el.checked && i!==-1) list.splice(i,1);
    state.checks[g] = list;
    if(!el.checked){
      var spec = allChecksSpecs().filter(function(sp){ return sp.group===g; })[0];
      var item = spec ? spec.items.filter(function(x){ return x.value===v; })[0] : null;
      if(item && item.rooms) state.rooms[item.rooms.key] = [];
    }
    save(); render(); return;
  }
  if(el.hasAttribute("data-room")){
    var rk = el.getAttribute("data-room"), idx = Number(el.getAttribute("data-idx")), field = el.getAttribute("data-field");
    var arr = (state.rooms[rk]||[]).slice();
    while(arr.length <= idx) arr.push({});
    arr[idx] = Object.assign({}, arr[idx]);
    arr[idx][field] = el.value;
    state.rooms[rk] = arr;
    save();
    $("drawerText").value = buildSummary();
    var st2 = $("summaryText"); if(st2) st2.value = buildSummary();
    renderRail();
    return;
  }
  if(el.matches('input[data-chip]')){
    var cg = el.getAttribute("data-chip");
    if(el.getAttribute("data-mode")==="radio"){ state.radio[cg] = el.value; }
    else{
      var l2 = (state.checks[cg]||[]).slice(), j = l2.indexOf(el.value);
      if(el.checked && j===-1) l2.push(el.value);
      if(!el.checked && j!==-1) l2.splice(j,1);
      state.checks[cg] = l2;
    }
    // 机サイズ：「特になし」と W/D の指定は相互排他
    if((cg==="deskW"||cg==="deskD") && el.checked){
      state.checks.deskNone = [];
    }
    if(cg==="deskNone" && (state.checks.deskNone||[]).length){
      state.radio.deskW = ""; state.radio.deskD = "";
      state.text.deskWOther = ""; state.text.deskDOther = "";
    }
    save(); render(); return;
  }
  if(el.hasAttribute("data-key")){
    var dk = el.getAttribute("data-key");
    state.text[dk] = el.value;
    if((dk==="deskWOther"||dk==="deskDOther") && el.value){ state.checks.deskNone = []; }
    save();
    $("drawerText").value = buildSummary();
    var st = $("summaryText"); if(st) st.value = buildSummary();
    renderRail();
  }
}

$("content").addEventListener("change", onChange);
$("content").addEventListener("input", function(e){
  if(e.target.hasAttribute && (e.target.hasAttribute("data-key") || e.target.hasAttribute("data-room"))) onChange(e);
});

$("content").addEventListener("click", function(e){
  var t = e.target;
  if(t.id === "copyBtn"){ doCopy($("summaryText"), t); }
  if(t.id === "resetBtn"){ doReset(t); }
  if(t.id === "submitBtn"){ doSubmit(); }
  if(t.hasAttribute && t.hasAttribute("data-detail-toggle")){
    var did = t.getAttribute("data-detail-toggle");
    expandedSections[did] = !expandedSections[did];
    render();
  }
  if(t.classList && t.classList.contains("room-add")){
    var rk = t.getAttribute("data-room");
    var arr = (state.rooms[rk]||[]).slice();
    if(!arr.length) arr.push({});
    arr.push({});
    state.rooms[rk] = arr;
    save(); render();
  }
  if(t.classList && t.classList.contains("room-del")){
    var rk2 = t.getAttribute("data-room"), idx2 = Number(t.getAttribute("data-idx"));
    var arr2 = (state.rooms[rk2]||[]).slice();
    arr2.splice(idx2,1);
    state.rooms[rk2] = arr2;
    save(); render();
  }
});

$("steps").addEventListener("click", function(e){
  var b = e.target.closest("button[data-i]");
  if(!b) return;
  step = Number(b.getAttribute("data-i"));
  render(); window.scrollTo(0,0);
});
$("prevBtn").addEventListener("click", function(){ step = Math.max(0,step-1); render(); window.scrollTo(0,0); });
$("nextBtn").addEventListener("click", function(){
  if(step===0){
    var issues = getRequiredIssues();
    if(issues.length){ invalidKeys = issues; render(); window.scrollTo(0,0); return; }
  }
  invalidKeys = [];
  step = Math.min(REVIEW_STEP,step+1); render(); window.scrollTo(0,0);
});

$("drawerBtn").addEventListener("click", function(){ $("drawerText").value = buildSummary(); $("backdrop").classList.add("open"); });
$("drawerClose").addEventListener("click", function(){ $("backdrop").classList.remove("open"); });
$("backdrop").addEventListener("click", function(e){ if(e.target === $("backdrop")) $("backdrop").classList.remove("open"); });
$("drawerCopy").addEventListener("click", function(){ doCopy($("drawerText"), $("drawerCopy")); });

var resetArmed = false, resetTimer = null;
function doReset(btn){
  if(!resetArmed){
    resetArmed = true; btn.textContent = "本当にクリア？";
    resetTimer = setTimeout(function(){ resetArmed = false; btn.textContent = "クリア"; }, 4000);
    return;
  }
  clearTimeout(resetTimer); resetArmed = false;
  state = emptyState(); photos = []; docs = [];
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  render();
}

function doCopy(area, btn){
  var text = area ? area.value : buildSummary();
  var label = btn.textContent;
  var done = function(msg){ btn.textContent = msg; setTimeout(function(){ btn.textContent = label; }, 2400); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ done("コピーしました"); }, function(){ done("コピーできません"); });
  } else { done("コピーできません"); }
}

/* 写真 */
function renderPhotos(){
  var wrap = $("photos"); if(!wrap) return;
  wrap.querySelectorAll(".photo").forEach(function(n){ n.remove(); });
  photos.forEach(function(p, idx){
    var d = document.createElement("div");
    d.className = "photo";
    d.style.backgroundImage = "url("+p.url+")";
    d.title = p.name;
    var b = document.createElement("button");
    b.type = "button"; b.textContent = "×"; b.setAttribute("aria-label","この写真を削除");
    b.addEventListener("click", function(){ photos.splice(idx,1); renderPhotos(); });
    d.appendChild(b);
    wrap.appendChild(d);
  });
  var input = $("photoInput");
  if(input && !input._bound){
    input._bound = true;
    input.addEventListener("change", function(){
      Array.prototype.slice.call(input.files||[]).forEach(function(f){
        if(photos.length >= MAX_IMAGES) return;
        if(f.size > MAX_IMAGE_BYTES) return;
        photos.push({file:f, url:URL.createObjectURL(f), name:f.name});
      });
      input.value = "";
      renderPhotos();
    });
  }
}

/* 物件資料 */
function renderDocs(){
  var wrap = $("docs"); if(!wrap) return;
  wrap.querySelectorAll(".doc-row").forEach(function(n){ n.remove(); });
  var addLabel = wrap.querySelector(".doc-add");
  docs.forEach(function(d, idx){
    var row = document.createElement("div");
    row.className = "doc-row";
    var name = document.createElement("span"); name.className = "dname"; name.textContent = d.name;
    var size = document.createElement("span"); size.className = "dsize"; size.textContent = (d.file.size/1024/1024).toFixed(1)+" MB";
    var b = document.createElement("button"); b.type="button"; b.textContent="×"; b.setAttribute("aria-label","この資料を削除");
    b.addEventListener("click", function(){ docs.splice(idx,1); renderDocs(); $("drawerText").value = buildSummary(); });
    row.appendChild(name); row.appendChild(size); row.appendChild(b);
    wrap.insertBefore(row, addLabel);
  });
  var input = $("docInput");
  if(input && !input._bound){
    input._bound = true;
    input.addEventListener("change", function(){
      Array.prototype.slice.call(input.files||[]).forEach(function(f){
        if(docs.length >= MAX_DOCS) return;
        if(f.size > MAX_DOC_BYTES) return;
        docs.push({file:f, name:f.name});
      });
      input.value = "";
      renderDocs();
      $("drawerText").value = buildSummary();
    });
  }
}

/* ─────────────────────────────────────────────
   6. 送信（Google Apps Script Web App 経由）
   ───────────────────────────────────────────── */
function setStatus(kind, text){
  var el = $("submitStatus"); if(!el) return;
  el.className = "status" + (kind ? " " + kind : "");
  el.textContent = text;
}

function fileToBase64(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){
      var r = reader.result || "", i = r.indexOf(",");
      resolve(i === -1 ? r : r.slice(i+1));
    };
    reader.onerror = function(){ reject(reader.error); };
    reader.readAsDataURL(file);
  });
}

function doSubmit(){
  if(submitting) return;
  var issues = getRequiredIssues();
  if(issues.length){
    invalidKeys = issues;
    step = 0; render(); window.scrollTo(0,0);
    return;
  }
  var summaryText = buildSummary();
  if(!summaryText){ setStatus("err","内容が空です。チェックか入力をしてから送信してください。"); return; }
  if(!GAS_WEBAPP_URL){ setStatus("err","送信先が未設定です（管理者向け：index.html の GAS_WEBAPP_URL を設定してください）"); return; }

  submitting = true;
  if($("submitBtn")){ $("submitBtn").disabled = true; $("submitBtn").textContent = "送信中…"; }
  setStatus(null, (photos.length||docs.length) ? "アップロード中…" : "送信中…");

  Promise.all(photos.map(function(p){
    return fileToBase64(p.file).then(function(content){
      return { filename:p.name, mimeType:p.file.type || "application/octet-stream", content:content };
    });
  })).then(function(photoAttachments){
    return Promise.all(docs.map(function(d){
      return fileToBase64(d.file).then(function(content){
        return { filename:d.name, mimeType:d.file.type || "application/octet-stream", content:content };
      });
    })).then(function(docAttachments){
      var payload = {
        checks: state.checks, radio: state.radio, text: state.text, rooms: state.rooms,
        summaryText: summaryText,
        submittedAt: new Date().toISOString(),
        photos: photoAttachments,
        docs: docAttachments
      };
      setStatus(null,"送信中…");
      // GAS Web App へのCORSプリフライトを避けるため text/plain で送り、
      // 受け側（doPost）で JSON.parse(e.postData.contents) する前提。
      return fetch(GAS_WEBAPP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
    });
  }).then(function(res){
    if(!res.ok) throw new Error("http_"+res.status);
    return res.json().catch(function(){ return {ok:true}; });
  }).then(function(json){
    if(json && json.ok === false) throw new Error(json.error || "server_error");
    setStatus("ok","送信しました");
    photos = []; docs = [];
    state = emptyState();
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  }).catch(function(err){
    setStatus("err","送信に失敗しました。通信環境をご確認のうえ、もう一度お試しください。（"+(err&&err.message?err.message:"")+"）");
  }).then(function(){
    submitting = false;
    if($("submitBtn")){ $("submitBtn").disabled = false; $("submitBtn").textContent = "送信"; }
  });
}

/* 起動：常に空欄からスタート（未送信の下書きがあれば復元） */
state = load() || emptyState();
render();

})();
</script>
